<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Matrices Peletizadoras</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#f4f5f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#e2e1dc;--acc:#1f3a5f;--accbg:#e6eef8;--red:#a32d2d;--redbg:#fcebeb;--green:#3b6d11;--greenbg:#eaf3de}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45}
header{background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
header .sub{font-size:12px;opacity:.8}
header .rol{margin-left:auto;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;font-size:12px;white-space:nowrap}
main{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card.p0{padding:0}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600}
.sec{font-size:13px;color:var(--mut);margin:16px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stk .lbl{font-size:13px;color:var(--mut)}
.stk .big{font-size:30px;font-weight:700;margin:2px 0 8px}
.stk .ln{display:flex;justify-content:space-between;align-items:center;margin:5px 0}
.stk .ln b{font-size:16px}
.neg{color:var(--red)!important}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.big{padding:7px 12px;font-size:14px}
.mut{color:var(--mut);font-size:13px}
.hint{color:var(--mut);font-size:12px;margin:6px 0 0}
button{font:inherit;cursor:pointer;border:1px solid #c9c8c2;background:#fff;color:var(--tx);border-radius:8px;padding:8px 12px}
button:hover{background:#f1f0ec}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.pri:hover{background:#2a4c78}
button.ico{padding:5px 8px;border:none;background:transparent;color:var(--mut);font-size:18px}
button.ico:hover{color:var(--tx);background:#f1f0ec}
button.dash{width:100%;border-style:dashed;color:var(--mut);margin-top:8px}
.acc{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:12px 0}
.acc button{height:62px;font-size:15px;font-weight:600}
.acc button i{font-size:22px;vertical-align:-4px;margin-right:4px}
.maq{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd);align-items:center}
.maq:last-child{border-bottom:none}
.maq-n{font-size:20px;font-weight:700;width:38px;color:var(--acc)}
.maq-d{flex:1;display:grid;gap:4px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{padding:10px 14px;border-bottom:1px solid var(--bd)}
.it:last-child{border-bottom:none}
.it .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.it .top b{font-weight:600}
.it .det{font-size:13px;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:6px;margin:16px 0 10px;overflow-x:auto}
.tabs button{border-radius:20px;padding:7px 14px;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.fil{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
select,input,textarea{font:inherit;padding:8px 10px;border:1px solid #c9c8c2;border-radius:8px;background:#fff;color:var(--tx);width:100%}
textarea{min-height:60px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt input{display:none}
.opt span{display:inline-block;cursor:pointer;border:2px solid transparent}
.opt.seg span{padding:8px 14px;border:1px solid #c9c8c2;border-radius:8px;background:#fff}
.opt input:checked+span{border:2px solid currentColor;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.opt.seg input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.seg.rot input:checked+span{background:var(--red);border-color:var(--red)}
.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--accbg);color:var(--acc);padding:4px 8px;border-radius:6px;font-size:13px;margin:2px}
.pchip button{border:none;background:none;padding:0 2px;color:inherit;font-size:15px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:1px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--bd)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--bd)}
.tbl td.n,.tbl th.n{text-align:right}
.tbl input{padding:5px 8px;max-width:90px}
.wrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;z-index:20}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:520px}
.modal-box h2{margin:0 0 4px;font-size:18px}
.mbtns{display:flex;gap:8px;margin-top:16px}
.mbtns button{flex:1;padding:11px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
.banner{background:var(--redbg);color:var(--red);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:14px}
.badge{font-size:11px;padding:2px 6px;border-radius:5px;background:#f1efe8;color:#5f5e5a;margin-left:4px}
.badge.rot{background:var(--redbg);color:var(--red)}
.badge.uso{background:var(--greenbg);color:var(--green)}
.empty{padding:20px;text-align:center;color:var(--mut)}
#printArea{display:none}
@media (max-width:520px){.stk .big{font-size:26px}.maq-d{font-size:13px}}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;font-size:12px}
  #printArea h1{font-size:18px;margin:0 0 4px}
  #printArea h2{font-size:14px;margin:14px 0 6px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #bbb;padding:4px 6px;text-align:left}
  .chip{border:1px solid #999}
}
</style>
</head>
<body>
<header>
  <div><h1>Matrices peletizadoras</h1><div class="sub">Fábrica de Alimentos Balanceados</div></div>
  <div class="rol" id="rolBadge"></div>
</header>
<main id="app"><div class="empty">Cargando datos…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC2lv-Bsz3mkWJkfTaOZswm8yOQ_knx-Lo",
  authDomain: "recepcion-mp.firebaseapp.com",
  projectId: "recepcion-mp",
  storageBucket: "recepcion-mp.firebasestorage.app",
  messagingSenderId: "188363107597",
  appId: "1:188363107597:web:a5a7e08341451a737bd444"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL_C = 'matrices_cambios', COL_F = 'matrices_facturas';
const DOC_CFG = db.collection('matrices_config').doc('general');

/* ---------- Rol por link ---------- */
const params = new URLSearchParams(location.search);
let ROL = (params.get('p') || 'produccion').toLowerCase();
if (!['produccion','admin','direccion'].includes(ROL)) ROL = 'produccion';
const ROL_NOMBRE = {produccion:'Producción / Mantenimiento', admin:'Administración', direccion:'Dirección'};
document.getElementById('rolBadge').textContent = ROL_NOMBRE[ROL];
const DIR = ROL === 'direccion';

/* ---------- Datos ---------- */
const PALETA = [
  {bg:'#E1F5EE',tx:'#085041'},{bg:'#EEEDFE',tx:'#3C3489'},{bg:'#FAECE7',tx:'#712B13'},
  {bg:'#EAF3DE',tx:'#27500A'},{bg:'#FBEAF0',tx:'#72243E'},{bg:'#E6F1FB',tx:'#0C447C'},
  {bg:'#FAEEDA',tx:'#633806'},{bg:'#FCEBEB',tx:'#791F1F'},{bg:'#F1EFE8',tx:'#444441'}
];
const CFG_DEF = {
  tpdMatriz:133, tpdRolos:133,
  proveedores:[
    {id:'hb', nombre:'HB Maquinarias', corto:'HB Maq.', color:0},
    {id:'candela', nombre:'Taller Candela', corto:'Candela', color:1},
    {id:'propia', nombre:'Importación propia', corto:'Imp. propia', color:2}
  ],
  stockInicial:{fecha:'2026-02-01', matrices:{}, camisas:{}}
};
let cfg = JSON.parse(JSON.stringify(CFG_DEF));
let cambios = [], facturas = [];
let loaded = {c:false, f:false, g:false};
let ui = {tab:'registro', anio:'todos', mes:'todos', pel:'todas', tipo:'todos'};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MOTIVOS = ['Desgaste','Imprevisto','Rotura'];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function diasEntre(a,b){const[y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);}
function fmtF(iso){if(!iso)return '';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y.slice(2);}
const fmtN = n => Math.round(n||0).toLocaleString('es-AR');
const sinAc = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function prov(id){return cfg.proveedores.find(p=>p.id===id) || {id, nombre:id||'—', corto:id||'—', color:8};}
function col(id){return PALETA[prov(id).color] || PALETA[8];}
function chip(id,big){const c=col(id);return `<span class="chip${big?' big':''}" style="background:${c.bg};color:${c.tx}">${esc(prov(id).corto||prov(id).nombre)}</span>`;}
const tpd = tipo => Number(tipo==='matriz' ? cfg.tpdMatriz : cfg.tpdRolos) || 0;
const icoT = t => t==='matriz' ? '<i class="ti ti-circle-dot"></i>' : '<i class="ti ti-cylinder"></i>';
const nomT = t => t==='matriz' ? 'Matriz' : 'Rolos';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function errMsg(e){return e && e.code==='permission-denied' ? 'La base de datos no dio permiso para guardar (revisar reglas de Firestore).' : 'Error: '+(e && e.message || e);}
function norm(s){return String(s||'').trim().replace(/\s+/g,' ').split(' ').map(w=>w?w[0].toLocaleUpperCase('es')+w.slice(1).toLocaleLowerCase('es'):'').join(' ');}
function personas(){const s=new Set();cambios.forEach(c=>{if(c.responsable)s.add(c.responsable);(c.operarios||[]).forEach(o=>s.add(o));});return [...s].sort((a,b)=>a.localeCompare(b,'es'));}
function canon(s){const n=norm(s);if(!n)return '';const ex=personas().find(p=>sinAc(p)===sinAc(n));return ex||n;}

/* ---------- Cálculos ---------- */
function ordenados(){return [...cambios].sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.creado||0)-(b.creado||0));}
function calcular(){
  const hoy=hoyISO(), R={}, ord=ordenados();
  ord.forEach((c,i)=>{
    const sig = ord.slice(i+1).find(x=>x.tipo===c.tipo && x.peletera===c.peletera);
    const ant = ord.slice(0,i).reverse().find(x=>x.tipo===c.tipo && x.peletera===c.peletera);
    const dias = Math.max(0, diasEntre(c.fecha, sig ? sig.fecha : hoy));
    R[c.id] = {dias, ton:dias*tpd(c.tipo), enUso:!sig, retiro:sig?sig.fecha:null, motivoRetiro:sig?(sig.motivo||''):null, anterior:ant||null};
  });
  return R;
}
function stock(){
  const s={matrices:{},camisas:{}}, si=cfg.stockInicial||{}, f0=si.fecha||'0000-00-00';
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  cfg.proveedores.forEach(p=>{s.matrices[p.id]=Number(si.matrices?.[p.id]||0);s.camisas[p.id]=Number(si.camisas?.[p.id]||0);});
  facturas.forEach(f=>{if(f.fecha<f0)return;add(s.matrices,f.proveedor,Number(f.matrices)||0);add(s.camisas,f.proveedor,Number(f.camisas)||0);});
  cambios.forEach(c=>{if(c.fecha<f0)return;if(c.tipo==='matriz')add(s.matrices,c.proveedor,-1);else add(s.camisas,c.proveedor,-(Number(c.cantidad)||2));});
  return s;
}
function actual(tipo,p,R){return cambios.find(c=>c.tipo===tipo && c.peletera===p && R[c.id] && R[c.id].enUso);}
function pasaFiltro(fecha){
  if(ui.anio!=='todos' && fecha.slice(0,4)!==ui.anio) return false;
  if(ui.mes!=='todos' && fecha.slice(5,7)!==ui.mes) return false;
  return true;
}
function filtrarCambios(){return cambios.filter(c=>pasaFiltro(c.fecha)&&(ui.pel==='todas'||c.peletera===+ui.pel)&&(ui.tipo==='todos'||c.tipo===ui.tipo)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0));}
function filtrarFacturas(){return facturas.filter(f=>pasaFiltro(f.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha));}
function periodoTxt(){
  let t = ui.anio==='todos' && ui.mes==='todos' ? 'Todo el período' :
          (ui.mes!=='todos' ? MESES[+ui.mes-1]+' ' : '') + (ui.anio!=='todos' ? ui.anio : (ui.mes!=='todos'?'(todos los años)':''));
  if(ui.anio!=='todos' && ui.mes==='todos') t='Año '+ui.anio;
  if(ui.pel!=='todas') t+=' · Peletera '+ui.pel;
  if(ui.tipo!=='todos') t+=' · '+(ui.tipo==='matriz'?'Solo matrices':'Solo rolos');
  return t;
}

/* ---------- Render ---------- */
let pendiente=false;
function render(){
  if(!(loaded.c && loaded.f && loaded.g)) return;
  const a=document.activeElement;
  if(a && $('#app').contains(a) && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')){
    if(!pendiente){pendiente=true;a.addEventListener('blur',()=>{pendiente=false;setTimeout(render,50);},{once:true});}
    return;
  }
  const R=calcular(), S=stock();
  let h='';
  if(ROL!=='produccion') h+=htmlStock(S);
  h+=htmlAcciones();
  h+=htmlEnMaquina(R);
  if(ROL==='produccion') h+=htmlUltimas(R);
  else {
    const tabs=[['registro','Registro'],['facturas','Facturas'],['reportes','Reportes']];
    if(DIR) tabs.push(['ajustes','Ajustes']);
    if(!tabs.find(t=>t[0]===ui.tab)) ui.tab='registro';
    h+=`<div class="tabs">${tabs.map(t=>`<button class="${ui.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
    if(ui.tab==='registro') h+=htmlFiltros(true)+htmlRegistro(R);
    if(ui.tab==='facturas') h+=htmlFiltros(false)+htmlFacturas();
    if(ui.tab==='reportes') h+=htmlFiltros(true)+htmlReporte(R,S);
    if(ui.tab==='ajustes') h+=htmlAjustes();
  }
  $('#app').innerHTML=h;
}
function setTab(t){ui.tab=t;render();}
function setF(k,v){ui[k]=v;render();}

function htmlStock(S){
  const tarjeta=(tit,obj)=>{
    const tot=Object.values(obj).reduce((a,b)=>a+b,0);
    const lineas=cfg.proveedores.map(p=>`<div class="ln">${chip(p.id)}<b class="${obj[p.id]<0?'neg':''}">${obj[p.id]||0}</b></div>`).join('');
    return `<div class="card stk"><div class="lbl">${tit}</div><div class="big ${tot<0?'neg':''}">${tot}</div>${lineas}</div>`;
  };
  return `<div class="g2">${tarjeta('Matrices en stock',S.matrices)}${tarjeta('Camisas de rolo en stock',S.camisas)}</div>`+
    (DIR?`<button class="dash" onclick="agregarProv()"><i class="ti ti-plus"></i> Agregar proveedor</button>`:'');
}
function htmlAcciones(){
  if(ROL==='admin') return '';
  return `<div class="acc">
    <button onclick="abrirCambio('matriz')"><i class="ti ti-circle-dot"></i>Cambio de matriz</button>
    <button onclick="abrirCambio('rolos')"><i class="ti ti-cylinder"></i>Cambio de rolos</button>
    ${DIR?`<button onclick="abrirFactura()"><i class="ti ti-file-invoice"></i>Cargar factura</button>`:''}
  </div>`;
}
function htmlEnMaquina(R){
  const lin=(tipo,c)=>c?`<div>${icoT(tipo)} ${nomT(tipo)} ${chip(c.proveedor)} <span class="mut">${R[c.id].dias} días · ${fmtN(R[c.id].ton)} t</span></div>`:`<div>${icoT(tipo)} ${nomT(tipo)} <span class="mut">sin datos</span></div>`;
  return `<div class="sec">En máquina ahora</div><div class="card p0">${[1,2,3].map(p=>`<div class="maq"><div class="maq-n">P${p}</div><div class="maq-d">${lin('matriz',actual('matriz',p,R))}${lin('rolos',actual('rolos',p,R))}</div></div>`).join('')}</div>`;
}
function htmlUltimas(R){
  const l=[...cambios].sort((a,b)=>(b.creado||0)-(a.creado||0)).slice(0,6);
  return `<div class="sec">Últimas cargas</div><div class="card p0">${l.length?l.map(c=>`<div class="it"><div class="top"><span>${fmtF(c.fecha)} · <b>P${c.peletera}</b> · ${icoT(c.tipo)} ${nomT(c.tipo)}</span>${chip(c.proveedor)}</div><div class="det">Resp.: ${esc(c.responsable)}${c.motivo?' · '+esc(c.motivo):''}</div></div>`).join(''):'<div class="empty">Todavía no hay cargas</div>'}</div>`;
}
function htmlFiltros(conPel){
  const anios=new Set([String(new Date().getFullYear())]);
  cambios.forEach(c=>anios.add(c.fecha.slice(0,4)));facturas.forEach(f=>anios.add(f.fecha.slice(0,4)));
  const op=(v,t,sel)=>`<option value="${v}" ${sel===v?'selected':''}>${t}</option>`;
  return `<div class="fil">
    <select onchange="setF('anio',this.value)">${op('todos','Todos los años',ui.anio)}${[...anios].sort().reverse().map(a=>op(a,a,ui.anio)).join('')}</select>
    <select onchange="setF('mes',this.value)">${op('todos','Todos los meses',ui.mes)}${MESES.map((m,i)=>op(String(i+1).padStart(2,'0'),m,ui.mes)).join('')}</select>
    ${conPel?`<select onchange="setF('pel',this.value)">${op('todas','Todas las peleteras',ui.pel)}${[1,2,3].map(p=>op(String(p),'Peletera '+p,ui.pel)).join('')}</select>
    <select onchange="setF('tipo',this.value)">${op('todos','Matrices y rolos',ui.tipo)}${op('matriz','Solo matrices',ui.tipo)}${op('rolos','Solo rolos',ui.tipo)}</select>`:''}
  </div>`;
}
function htmlItemCambio(c,R,acciones){
  const r=R[c.id];
  const estado=r.enUso?`<span class="badge uso">en uso</span> ${r.dias} días · ${fmtN(r.ton)} t hasta hoy`:`Duró ${r.dias} días · ${fmtN(r.ton)} t (retirada ${fmtF(r.retiro)}${r.motivoRetiro?' por '+r.motivoRetiro.toLowerCase():''})`;
  return `<div class="it">
    <div class="top"><span>${fmtF(c.fecha)} · <b>P${c.peletera}</b> · ${icoT(c.tipo)} ${nomT(c.tipo)}${c.motivo==='Rotura'?'<span class="badge rot">Rotura</span>':c.motivo?'<span class="badge">'+esc(c.motivo)+'</span>':''}</span>
    <span class="row" style="gap:2px">${chip(c.proveedor)}${acciones?`<button class="ico" title="Corregir" onclick="abrirCambio('${c.tipo}','${c.id}')"><i class="ti ti-edit"></i></button><button class="ico" title="Borrar" onclick="borrar('${COL_C}','${c.id}')"><i class="ti ti-trash"></i></button>`:''}</span></div>
    <div class="det">Responsable: <b>${esc(c.responsable)}</b>${(c.operarios||[]).length?' · Operarios: '+c.operarios.map(esc).join(', '):''}</div>

/* ---------- Reportes ---------- */
function datosReporte(R){
  const l=filtrarCambios();
  const pp={matriz:{},rolos:{}}, pel={1:{},2:{},3:{}}, resp={};
  const base=()=>({n:0,fin:0,dias:0,ton:0,Desgaste:0,Imprevisto:0,Rotura:0});
  l.forEach(c=>{
    const r=R[c.id];
    const g=pp[c.tipo][c.proveedor]=pp[c.tipo][c.proveedor]||base();
    const q=pel[c.peletera][c.tipo]=pel[c.peletera][c.tipo]||base();
    [g,q].forEach(o=>{o.n++;if(!r.enUso){o.fin++;o.dias+=r.dias;o.ton+=r.ton;if(r.motivoRetiro&&o[r.motivoRetiro]!==undefined)o[r.motivoRetiro]++;}});
    if(c.responsable){resp[c.responsable]=resp[c.responsable]||{resp:0,op:0};resp[c.responsable].resp++;}
    (c.operarios||[]).forEach(o=>{resp[o]=resp[o]||{resp:0,op:0};resp[o].op++;});
  });
  return {l,pp,pel,resp};
}
const prom=(o,k)=>o.fin?o[k]/o.fin:0;
function tablaProv(obj,titulo){
  const ks=Object.keys(obj);
  if(!ks.length) return `<h3>${titulo}</h3><div class="mut">Sin datos</div>`;
  return `<h3>${titulo}</h3><div class="wrap"><table class="tbl"><tr><th>Proveedor</th><th class="n">Colocadas</th><th class="n">Días prom.</th><th class="n">t prom.</th><th class="n">Desg.</th><th class="n">Impr.</th><th class="n">Rot.</th></tr>
  ${ks.map(k=>{const o=obj[k];return `<tr><td>${chip(k)}</td><td class="n">${o.n}</td><td class="n">${o.fin?fmtN(prom(o,'dias')):'—'}</td><td class="n">${o.fin?fmtN(prom(o,'ton')):'—'}</td><td class="n">${o.Desgaste}</td><td class="n">${o.Imprevisto}</td><td class="n">${o.Rotura}</td></tr>`}).join('')}</table></div>`;
}

  const d=datosReporte(R);
  return `<div class="mut" style="margin-bottom:6px">${periodoTxt()}</div>
  <div class="row" style="margin-bottom:10px">

  ${[1,2,3].map(p=>{const m=d.pel[p].matriz||{n:0,fin:0,Rotura:0},r=d.pel[p].rolos||{n:0,fin:0,Rotura:0};return `<tr><td><b>P${p}</b></td><td class="n">${m.n}</td><td class="n">${m.fin?fmtN(prom(m,'dias')):'—'}</td><td class="n">${r.n}</td><td class="n">${r.fin?fmtN(prom(r,'dias')):'—'}</td><td class="n">${m.Rotura+r.Rotura}</td></tr>`}).join('')}</table></div></div>

}
function textoReporte(){
  const R=calcular(), S=stock(), d=datosReporte(R);
  const sumT=o=>Object.values(o).reduce((a,b)=>a+b,0);
  const stkL=o=>cfg.proveedores.map(p=>`${p.corto} ${o[p.id]||0}`).join(', ');
  let t=`*MATRICES PELETIZADORAS*\nReporte: ${periodoTxt()}\n\n*Stock actual*\nMatrices: ${sumT(S.matrices)} (${stkL(S.matrices)})\nCamisas de rolo: ${sumT(S.camisas)} (${stkL(S.camisas)})\n`;
  const bloque=(obj,tit)=>{t+=`\n*${tit}*\n`;const ks=Object.keys(obj);if(!ks.length){t+='Sin datos\n';return;}ks.forEach(k=>{const o=obj[k];t+=`• ${prov(k).nombre}: ${o.n} colocadas${o.fin?` · prom. ${fmtN(prom(o,'dias'))} días · ${fmtN(prom(o,'ton'))} t`:''} · Roturas ${o.Rotura}\n`;});};
  bloque(d.pp.matriz,'Matrices por proveedor');
  bloque(d.pp.rolos,'Rolos por proveedor');
  t+=`\n*Detalle*\n`;
  if(!d.l.length) t+='Sin cambios\n';
  d.l.forEach(c=>{const r=R[c.id];t+=`${fmtF(c.fecha)} · P${c.peletera} · ${nomT(c.tipo)} ${prov(c.proveedor).corto} · Resp. ${c.responsable}${(c.operarios||[]).length?' (op. '+c.operarios.join(', ')+')':''}${c.motivo?' · '+c.motivo:''} · ${r.enUso?'en uso '+r.dias+' días':'duró '+r.dias+' días'}${c.obs?' · Obs: '+c.obs:''}\n`;});
  return t;
}
function imprimir(){
  const R=calcular(), S=stock(), d=datosReporte(R);
  const sumT=o=>Object.values(o).reduce((a,b)=>a+b,0);
  const tp=(obj)=>{const ks=Object.keys(obj);if(!ks.length)return '<p>Sin datos</p>';return `<table><tr><th>Proveedor</th><th>Colocadas</th><th>Días prom.</th><th>t prom.</th><th>Desgaste</th><th>Imprevisto</th><th>Rotura</th></tr>${ks.map(k=>{const o=obj[k];return `<tr><td>${esc(prov(k).nombre)}</td><td>${o.n}</td><td>${o.fin?fmtN(prom(o,'dias')):'—'}</td><td>${o.fin?fmtN(prom(o,'ton')):'—'}</td><td>${o.Desgaste}</td><td>${o.Imprevisto}</td><td>${o.Rotura}</td></tr>`}).join('')}</table>`;};
  $('#printArea').innerHTML=`<h1>Matrices peletizadoras — Fábrica de Alimentos Balanceados</h1><div>${periodoTxt()} · Impreso ${fmtF(hoyISO())}</div>
  <h2>Stock actual</h2><table><tr><th>Proveedor</th><th>Matrices</th><th>Camisas</th></tr>${cfg.proveedores.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${S.matrices[p.id]||0}</td><td>${S.camisas[p.id]||0}</td></tr>`).join('')}<tr><th>Total</th><th>${sumT(S.matrices)}</th><th>${sumT(S.camisas)}</th></tr></table>
  <h2>Matrices por proveedor</h2>${tp(d.pp.matriz)}<h2>Rolos por proveedor</h2>${tp(d.pp.rolos)}
  <h2>Detalle de cambios</h2><table><tr><th>Fecha</th><th>Pel.</th><th>Tipo</th><th>Proveedor</th><th>Responsable</th><th>Operarios</th><th>Motivo</th><th>Días</th><th>t</th><th>Obs.</th></tr>
  ${d.l.map(c=>{const r=R[c.id];return `<tr><td>${fmtF(c.fecha)}</td><td>P${c.peletera}</td><td>${nomT(c.tipo)}</td><td>${esc(prov(c.proveedor).nombre)}</td><td>${esc(c.responsable)}</td><td>${(c.operarios||[]).map(esc).join(', ')}</td><td>${esc(c.motivo||'')}</td><td>${r.dias}${r.enUso?' (en uso)':''}</td><td>${fmtN(r.ton)}</td><td>${esc(c.obs||'')}</td></tr>`}).join('')}</table>`;
  window.print();
}

function agregarProv(){
  const n=(prompt('Nombre del nuevo proveedor:')||'').trim(); if(!n) return;
  if(cfg.proveedores.some(p=>sinAc(p.nombre)===sinAc(n))) return alert('Ese proveedor ya existe.');
  const usados=cfg.proveedores.map(p=>p.color);
  let c=[0,1,2,3,4,5,6,7].find(i=>!usados.includes(i)); if(c===undefined) c=cfg.proveedores.length%8;
  const id=sinAc(n).replace(/[^a-z0-9]+/g,'').slice(0,12)+'_'+Date.now().toString(36);
  cfg.proveedores.push({id,nombre:n,corto:n.length>14?n.slice(0,13)+'.':n,color:c});
  guardarCfg('Proveedor agregado');
}

}

async function guardarCambio(){
  const fd=new FormData($('#fC')), err=$('#f_err');
  if($('#f_op').value.trim()) addOp();
  const fecha=$('#f_fecha').value, pel=Number(fd.get('pel')), pv=fd.get('prov'), resp=canon($('#f_resp').value);
  const faltan=[];
  if(!fecha)faltan.push('fecha');if(!pel)faltan.push('peletera');if(!pv)faltan.push('proveedor');if(!resp)faltan.push('responsable');
  const conR=$('#f_conR')&&$('#f_conR').checked, rpv=fd.get('rprov');
  if(conR&&!rpv)faltan.push('proveedor de las camisas');
  if(faltan.length){err.textContent='Falta completar: '+faltan.join(', ')+'.';return;}
  if(fecha>hoyISO()){err.textContent='La fecha no puede ser futura.';return;}
  const data={tipo:F.tipo,fecha,peletera:pel,proveedor:pv,responsable:resp,operarios:F.ops,motivo:fd.get('mot')||'',obs:$('#f_obs').value.trim()};
  if(F.tipo==='rolos') data.cantidad=2;
  if(!F.id && cambios.some(c=>c.tipo===F.tipo&&c.peletera===pel&&c.fecha===fecha) && !confirm('Ya hay un cambio de '+nomT(F.tipo).toLowerCase()+' en la Peletera '+pel+' con esa fecha. ¿Guardar igual?')) return;
  $('#f_btn').disabled=true; err.textContent='';
  try{
    if(F.id){ await db.collection(COL_C).doc(F.id).update({...data,editado:Date.now()}); }
    else{
      const t=Date.now();
      await db.collection(COL_C).add({...data,creado:t,cargadoDesde:ROL});
      if(conR) await db.collection(COL_C).add({tipo:'rolos',fecha,peletera:pel,proveedor:rpv,responsable:resp,operarios:F.ops,motivo:data.motivo,obs:data.obs,cantidad:2,creado:t+1,cargadoDesde:ROL});
    }
    cerrarModal(); toast('Guardado');
  }catch(e){err.textContent=errMsg(e);$('#f_btn').disabled=false;}
}

    <div class="g2"><div><label class="f">Matrices</label><input type="number" min="0" id="ff_m" value="${f?Number(f.matrices)||0:0}"></div>
    <div><label class="f">Camisas de rolo</label><input type="number" min="0" id="ff_c" value="${f?Number(f.camisas)||0:0}"></div></div>
    <label class="f">Observaciones</label><textarea id="ff_obs">${f?esc(f.obs||''):''}</textarea>
    <div class="err" id="ff_err"></div>
    <div class="mbtns"><button type="button" onclick="cerrarModal()">Cancelar</button><button type="button" class="pri" id="ff_btn" onclick="guardarFactura()">Guardar</button></div>
  </form>`);
}
async function guardarFactura(){
  const fd=new FormData($('#fF')), err=$('#ff_err');
  const fecha=$('#ff_fecha').value, pv=fd.get('prov'), m=Math.max(0,Number($('#ff_m').value)||0), c=Math.max(0,Number($('#ff_c').value)||0);
  if(!fecha||!pv){err.textContent='Falta completar: '+[!fecha&&'fecha',!pv&&'proveedor'].filter(Boolean).join(', ')+'.';return;}
  if(!m&&!c){err.textContent='Cargá al menos una matriz o una camisa.';return;}
  const data={fecha,numero:$('#ff_num').value.trim(),proveedor:pv,matrices:m,camisas:c,obs:$('#ff_obs').value.trim()};
  $('#ff_btn').disabled=true;
  try{
    if(F.id) await db.collection(COL_F).doc(F.id).update({...data,editado:Date.now()});
    else await db.collection(COL_F).add({...data,creado:Date.now()});
    cerrarModal(); toast('Factura guardada');
  }catch(e){err.textContent=errMsg(e);$('#ff_btn').disabled=false;}
}
async function borrar(colName,id){
  if(!DIR) return;
  if(!confirm('¿Borrar este registro? No se puede deshacer.')) return;
  try{await db.collection(colName).doc(id).delete();toast('Borrado');}catch(e){alert(errMsg(e));}
}

/* ---------- Tiempo real ---------- */
function falla(e){$('#app').innerHTML=`<div class="banner"><b>No se pudo conectar con la base de datos.</b><br>${esc(errMsg(e))}</div>`;}
DOC_CFG.onSnapshot(s=>{
  if(s.exists){const d=s.data();cfg={...JSON.parse(JSON.stringify(CFG_DEF)),...d};if(!Array.isArray(cfg.proveedores)||!cfg.proveedores.length)cfg.proveedores=CFG_DEF.proveedores;}
  loaded.g=true;render();
},falla);
db.collection(COL_C).onSnapshot(s=>{cambios=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.fecha&&c.tipo);loaded.c=true;render();},falla);
db.collection(COL_F).onSnapshot(s=>{facturas=s.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.fecha);loaded.f=true;render();},falla);
setInterval(()=>{if(loaded.c)render();},60*60*1000);
</script>
