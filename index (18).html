<style>

.opts{display:flex;flex-wrap:wrap;gap:6px}

.pchip{display:inline-flex;align-items:center;gap:4px;background:var(--accbg);color:var(--acc);padding:4px 8px;border-radius:6px;font-size:13px;margin:2px}

header{flex-wrap:wrap}
.hacc{display:none;gap:8px;margin-left:auto}

.maq3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}

.mq .n{font-weight:700;color:var(--acc);font-size:15px}

@media (min-width:900px){
  main.wide{max-width:1360px}
  .wide .hacc-twin{display:none}
  .hacc{display:flex}
  .top{grid-template-columns:1fr 1fr 1.7fr}
  .top .maqc{grid-column:auto}
}
.rb{cursor:pointer}
.rb:hover{background:#fafaf7}
.rb-ln2{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;margin-top:4px}
.rw{display:flex;align-items:center;gap:6px}
.rb-hd .ver{margin-left:auto;font-size:12px;color:var(--acc)}
.det{margin:8px 0 2px 58px;padding:8px 10px;background:#f6f6f3;border-radius:8px;font-size:13px;line-height:1.5;cursor:default}
.det .dl{display:flex;gap:6px;align-items:flex-start;padding:3px 0}
.det .dl+.dl{border-top:1px solid var(--bd)}

.det .o.r{color:var(--red)}
.tbl input.nt{max-width:56px;padding:5px 6px}

@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block;font-size:12px}
  #printArea h1{font-size:18px;margin:0 0 4px}
  #printArea h2{font-size:14px;margin:14px 0 6px}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea th,#printArea td{border:1px solid #bbb;padding:4px 6px;text-align:left}
  .chip{border:1px solid #999}
}
</style>

<body>
<header>
  <div><h1>Matrices peletizadoras</h1><div class="sub">Fábrica de Alimentos Balanceados</div></div>
  <div class="hacc" id="hacc"></div><div class="rol" id="rolBadge"></div>
</header>
<main id="app"><div class="empty">Cargando datos…</div></main>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC2lv-Bsz3mkWJkfTaOZswm8yOQ_knx-Lo",
  authDomain: "recepcion-mp.firebaseapp.com",
  projectId: "recepcion-mp",
  storageBucket: "recepcion-mp.firebasestorage.app",
  messagingSenderId: "188363107597",
  appId: "1:188363107597:web:a5a7e08341451a737bd444"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const COL_C = 'matrices_cambios', COL_F = 'matrices_facturas';
const DOC_CFG = db.collection('matrices_config').doc('general');

/* ---------- Rol por link ---------- */
const params = new URLSearchParams(location.search);
let ROL = (params.get('p') || 'produccion').toLowerCase();
if (!['produccion','admin','direccion'].includes(ROL)) ROL = 'produccion';
const ROL_NOMBRE = {produccion:'Producción / Mantenimiento', admin:'Administración', direccion:'Dirección'};
document.getElementById('rolBadge').textContent = ROL_NOMBRE[ROL];
const DIR = ROL === 'direccion';

/* ---------- Datos ---------- */
const PALETA = [
  {bg:'#E1F5EE',tx:'#085041'},{bg:'#EEEDFE',tx:'#3C3489'},{bg:'#FAECE7',tx:'#712B13'},
  {bg:'#EAF3DE',tx:'#27500A'},{bg:'#FBEAF0',tx:'#72243E'},{bg:'#E6F1FB',tx:'#0C447C'},
  {bg:'#FAEEDA',tx:'#633806'},{bg:'#FCEBEB',tx:'#791F1F'},{bg:'#F1EFE8',tx:'#444441'}
];
const CFG_DEF = {
  tpdMatriz:133, tpdRolos:133,
  proveedores:[
    {id:'hb', nombre:'HB Maquinarias', corto:'HB Maq.', color:0},
    {id:'candela', nombre:'Taller Candela', corto:'Candela', color:1},
    {id:'propia', nombre:'Importación propia', corto:'Imp. propia', color:2}
  ],
  stockInicial:{fecha:'2026-02-01', matrices:{}, camisas:{}},
  produccion:{}
};
let cfg = JSON.parse(JSON.stringify(CFG_DEF));
let cambios = [], facturas = [];
let loaded = {c:false, f:false, g:false};
let ui = {tab:null, anio:'todos', mes:'todos', pel:'todas', tipo:'todos', abiertos:new Set()};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MOTIVOS = ['Desgaste','Imprevisto','Rotura'];

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function diasEntre(a,b){const[y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);}
function fmtF(iso){if(!iso)return '';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y.slice(2);}
const fmtN = n => Math.round(n||0).toLocaleString('es-AR');
const sinAc = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function prov(id){return cfg.proveedores.find(p=>p.id===id) || {id, nombre:id||'—', corto:id||'—', color:8};}
function col(id){return PALETA[prov(id).color] || PALETA[8];}
function chip(id,big){const c=col(id);return `<span class="chip${big?' big':''}" style="background:${c.bg};color:${c.tx}">${esc(prov(id).corto||prov(id).nombre)}</span>`;}
const tpd = tipo => Number(tipo==='matriz' ? cfg.tpdMatriz : cfg.tpdRolos) || 0;
const icoT = t => t==='matriz' ? '<i class="ti ti-circle-dot"></i>' : '<i class="ti ti-cylinder"></i>';
const nomT = t => t==='matriz' ? 'Matriz' : 'Rolos';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function errMsg(e){return e && e.code==='permission-denied' ? 'La base de datos no dio permiso para guardar (revisar reglas de Firestore).' : 'Error: '+(e && e.message || e);}
function norm(s){return String(s||'').trim().replace(/\s+/g,' ').split(' ').map(w=>w?w[0].toLocaleUpperCase('es')+w.slice(1).toLocaleLowerCase('es'):'').join(' ');}
function personas(){const s=new Set();cambios.forEach(c=>{if(c.responsable)s.add(c.responsable);(c.operarios||[]).forEach(o=>s.add(o));});return [...s].sort((a,b)=>a.localeCompare(b,'es'));}
function canon(s){const n=norm(s);if(!n)return '';const ex=personas().find(p=>sinAc(p)===sinAc(n));return ex||n;}

/* ---------- Producción mensual ---------- */
const diasDelMes = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
function domingosDelMes(y,m){let n=0;const d=diasDelMes(y,m);for(let i=1;i<=d;i++)if(new Date(Date.UTC(y,m-1,i)).getUTCDay()===0)n++;return n;}
function datosMes(clave){
  const [y,m]=clave.split('-').map(Number), p=(cfg.produccion||{})[clave]||{}, dm=diasDelMes(y,m);
  const kg=Number(p.kg)||0;
  const noTrab = p.noTrab===undefined||p.noTrab===null||p.noTrab==='' ? domingosDelMes(y,m) : Number(p.noTrab)||0;
  const trab=Math.max(0,dm-noTrab);
  return {kg, dm, noTrab, trab, tpdPel: kg&&trab ? kg/1000/trab/3 : 0};
}
// Toneladas de una pieza entre dos fechas (desde incluido, hasta excluido)
function tonEntre(desde,hasta,tipo){
  if(!desde||!hasta||hasta<=desde) return 0;
  let tot=0, [y,m]=desde.split('-').map(Number);
  while(true){
    const clave=y+'-'+String(m).padStart(2,'0');
    const ini=clave+'-01', fin=(m===12?(y+1)+'-01':y+'-'+String(m+1).padStart(2,'0'))+'-01';
    const a=desde>ini?desde:ini, b=hasta<fin?hasta:fin;
    if(b>a){
      const d=diasEntre(a,b), dm=datosMes(clave);
      tot += dm.kg && dm.trab ? d*(dm.trab/dm.dm)*dm.tpdPel : d*tpd(tipo);
    }
    if(fin>=hasta) break;
    m++; if(m>12){m=1;y++;}
  }
  return tot;
}

/* ---------- Cálculos ---------- */
function ordenados(){return [...cambios].sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.creado||0)-(b.creado||0));}
function calcular(){
  const hoy=hoyISO(), R={}, ord=ordenados();
  ord.forEach((c,i)=>{
    const sig = ord.slice(i+1).find(x=>x.tipo===c.tipo && x.peletera===c.peletera);
    const ant = ord.slice(0,i).reverse().find(x=>x.tipo===c.tipo && x.peletera===c.peletera);
    const hasta = sig ? sig.fecha : hoy;
    const dias = Math.max(0, diasEntre(c.fecha, hasta));
    R[c.id] = {dias, ton:tonEntre(c.fecha,hasta,c.tipo), enUso:!sig, hasta, retiro:sig?sig.fecha:null, motivoRetiro:sig?(sig.motivo||''):null, obsRetiro:sig?(sig.obs||''):'', sig:sig||null, anterior:ant||null};
  });
  return R;
}
function stock(){
  const s={matrices:{},camisas:{}}, si=cfg.stockInicial||{}, f0=si.fecha||'0000-00-00';
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  cfg.proveedores.forEach(p=>{s.matrices[p.id]=Number(si.matrices?.[p.id]||0);s.camisas[p.id]=Number(si.camisas?.[p.id]||0);});
  facturas.forEach(f=>{if(f.fecha<f0)return;add(s.matrices,f.proveedor,Number(f.matrices)||0);add(s.camisas,f.proveedor,Number(f.camisas)||0);});
  cambios.forEach(c=>{if(c.fecha<f0)return;if(c.tipo==='matriz')add(s.matrices,c.proveedor,-1);else add(s.camisas,c.proveedor,-(Number(c.cantidad)||2));});
  return s;
}
function actual(tipo,p,R){return cambios.find(c=>c.tipo===tipo && c.peletera===p && R[c.id] && R[c.id].enUso);}
function pasaFiltro(fecha){
  if(ui.anio!=='todos' && fecha.slice(0,4)!==ui.anio) return false;
  if(ui.mes!=='todos' && fecha.slice(5,7)!==ui.mes) return false;
  return true;
}
function filtrarCambios(){return cambios.filter(c=>pasaFiltro(c.fecha)&&(ui.pel==='todas'||c.peletera===+ui.pel)&&(ui.tipo==='todos'||c.tipo===ui.tipo)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0));}
function filtrarFacturas(){return facturas.filter(f=>pasaFiltro(f.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha));}
function periodoTxt(){

let pendiente=false;
function render(){
  if(!(loaded.c && loaded.f && loaded.g)) return;
  const a=document.activeElement;
  if(a && $('#app').contains(a) && (a.tagName==='INPUT'||a.tagName==='TEXTAREA')){
    if(!pendiente){pendiente=true;a.addEventListener('blur',()=>{pendiente=false;setTimeout(render,50);},{once:true});}

  }
  const R=calcular(), S=stock();
  let h='';
  $('#app').classList.toggle('wide', ROL!=='produccion');
  $('#hacc').innerHTML = DIR ? `<button onclick="abrirCambio('matriz')"><i class="ti ti-circle-dot"></i> Cambio de matriz</button><button onclick="abrirCambio('rolos')"><i class="ti ti-cylinder"></i> Cambio de rolos</button><button onclick="abrirFactura()"><i class="ti ti-file-invoice"></i> Cargar factura</button>` : '';
  if(ROL==='produccion'){ h+=htmlAcciones(); h+=htmlEnMaquina(R); h+=htmlUltimas(R); }
  else {
    h+=`<div class="top">${htmlStock(S)}${htmlMaqCompacto(R)}</div>`;

    const tabs=[['registro','<i class="ti ti-list-details"></i>Ver cambios por fecha'],['facturas','<i class="ti ti-file-invoice"></i>Facturas'],['reportes','<i class="ti ti-chart-bar"></i>Reportes']];
    if(DIR) tabs.push(['ajustes','<i class="ti ti-settings"></i>Ajustes']);
    if(ui.tab && !tabs.find(t=>t[0]===ui.tab)) ui.tab=null;
    h+=`<div class="tabs">${tabs.map(t=>`<button class="${ui.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
    if(!ui.tab) h+=`<div class="ph">Tocá un botón para ver el detalle. Tocándolo de nuevo se cierra.</div>`;
    if(ui.tab==='registro') h+=htmlFiltros(true)+htmlRegistro(R);

    if(ui.tab==='reportes') h+=htmlFiltros(true)+htmlReporte(R,S);
    if(ui.tab==='ajustes') h+=htmlAjustes();
  }
  $('#app').innerHTML=h;
}

/* ---------- Reportes ---------- */
function datosReporte(R){
  const l=filtrarCambios();
  const pp={matriz:{},rolos:{}};
  const base=()=>({n:0,fin:0,dias:0,ton:0,Desgaste:0,Imprevisto:0,Rotura:0});
  l.forEach(c=>{
    const r=R[c.id];
    const g=pp[c.tipo][c.proveedor]=pp[c.tipo][c.proveedor]||base();
    g.n++;if(!r.enUso){g.fin++;g.dias+=r.dias;g.ton+=r.ton;if(r.motivoRetiro&&g[r.motivoRetiro]!==undefined)g[r.motivoRetiro]++;}
  });
  return {l,pp};
}
// Resumen: cada matriz con los pares de rolos que trabajaron durante su vida
function datosResumen(R){
  const filtro=c=>pasaFiltro(c.fecha)&&(ui.pel==='todas'||c.peletera===+ui.pel);
  const mats=cambios.filter(c=>c.tipo==='matriz'&&filtro(c)).sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0));
  const rolos=cambios.filter(c=>c.tipo==='rolos');
  const filas=mats.map(m=>{
    const r=R[m.id];
    const segs=rolos.filter(x=>x.peletera===m.peletera && x.fecha<r.hasta && R[x.id].hasta>m.fecha)
      .sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.creado||0)-(b.creado||0))
      .map(x=>{const rx=R[x.id];const a=x.fecha>m.fecha?x.fecha:m.fecha, b=rx.hasta<r.hasta?rx.hasta:r.hasta;
        return {c:x, dias:diasEntre(a,b), ton:tonEntre(a,b,'rolos'), enUso:rx.enUso&&b===rx.hasta, rot:!rx.enUso&&rx.motivoRetiro==='Rotura'&&b===rx.hasta};})
      .filter(s=>s.dias>0||r.dias===0);
    return {m, r, segs};
  });
  const mRet=filas.filter(f=>!f.r.enUso);
  const rRet=rolos.filter(x=>filtro(x)&&!R[x.id].enUso);
  const avg=(arr,f)=>arr.length?arr.reduce((s,x)=>s+f(x),0)/arr.length:0;
  return {filas,
    mDias:avg(mRet,f=>f.r.dias), mTon:avg(mRet,f=>f.r.ton), mN:mRet.length,
    rDias:avg(rRet,x=>R[x.id].dias), rTon:avg(rRet,x=>R[x.id].ton), rN:rRet.length};
}

    return `<div class="rb" onclick="toggleDet('${m.id}')">

}

function textoReporte(){
  const R=calcular(), S=stock(), d=datosReporte(R);
  const sumT=o=>Object.values(o).reduce((a,b)=>a+b,0);
  const stkL=o=>cfg.proveedores.map(p=>`${p.corto} ${o[p.id]||0}`).join(', ');
  let t=`*MATRICES PELETIZADORAS*\nReporte: ${periodoTxt()}\n\n*Stock actual*\nMatrices: ${sumT(S.matrices)} (${stkL(S.matrices)})\nCamisas de rolo: ${sumT(S.camisas)} (${stkL(S.camisas)})\n`;
  const bloque=(obj,tit)=>{t+=`\n*${tit}*\n`;const ks=Object.keys(obj);if(!ks.length){t+='Sin datos\n';return;}ks.forEach(k=>{const o=obj[k];t+=`• ${prov(k).nombre}: ${o.n} colocadas${o.fin?` · prom. ${fmtN(prom(o,'dias'))} días · ${fmtN(prom(o,'ton'))} t`:''} · Roturas ${o.Rotura}\n`;});};
  const rs=datosResumen(R);
  t+=`\n*Resumen de matrices*\n`;
  if(rs.mN) t+=`Matriz promedio: ${fmtN(rs.mDias)} días · ${fmtN(rs.mTon)} t\n`;
  if(rs.rN) t+=`Par de rolos promedio: ${fmtN(rs.rDias)} días · ${fmtN(rs.rTon)} t\n`;
  if(!rs.filas.length) t+='Sin matrices\n';
  rs.filas.forEach(({m,r,segs})=>{t+=`• P${m.peletera} ${prov(m.proveedor).corto} ${fmtF(m.fecha)} → ${r.enUso?'hoy (en uso)':fmtF(r.retiro)} · ${r.dias} días · ${fmtN(r.ton)} t${!r.enUso&&r.motivoRetiro?' · '+r.motivoRetiro:''} · ${segs.length} par${segs.length===1?'':'es'} de rolos\n`;});
  bloque(d.pp.matriz,'Matrices por proveedor');
  bloque(d.pp.rolos,'Rolos por proveedor');
  t+=`\n*Detalle*\n`;
  if(!d.l.length) t+='Sin cambios\n';
  d.l.forEach(c=>{const r=R[c.id];t+=`${fmtF(c.fecha)} · P${c.peletera} · ${nomT(c.tipo)} ${prov(c.proveedor).corto} · Resp. ${c.responsable}${(c.operarios||[]).length?' (op. '+c.operarios.join(', ')+')':''}${c.motivo?' · '+c.motivo:''} · ${r.enUso?'en uso '+r.dias+' días':'duró '+r.dias+' días'}${c.obs?' · Obs: '+c.obs:''}\n`;});
  return t;
}
function imprimir(){
  const R=calcular(), S=stock(), d=datosReporte(R);
  const sumT=o=>Object.values(o).reduce((a,b)=>a+b,0);
  const tp=(obj)=>{const ks=Object.keys(obj);if(!ks.length)return '<p>Sin datos</p>';return `<table><tr><th>Proveedor</th><th>Colocadas</th><th>Días prom.</th><th>t prom.</th><th>Desgaste</th><th>Imprevisto</th><th>Rotura</th></tr>${ks.map(k=>{const o=obj[k];return `<tr><td>${esc(prov(k).nombre)}</td><td>${o.n}</td><td>${o.fin?fmtN(prom(o,'dias')):'—'}</td><td>${o.fin?fmtN(prom(o,'ton')):'—'}</td><td>${o.Desgaste}</td><td>${o.Imprevisto}</td><td>${o.Rotura}</td></tr>`}).join('')}</table>`;};
  $('#printArea').innerHTML=`<h1>Matrices peletizadoras — Fábrica de Alimentos Balanceados</h1><div>${periodoTxt()} · Impreso ${fmtF(hoyISO())}</div>
  <h2>Stock actual</h2><table><tr><th>Proveedor</th><th>Matrices</th><th>Camisas</th></tr>${cfg.proveedores.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${S.matrices[p.id]||0}</td><td>${S.camisas[p.id]||0}</td></tr>`).join('')}<tr><th>Total</th><th>${sumT(S.matrices)}</th><th>${sumT(S.camisas)}</th></tr></table>
  <h2>Resumen de matrices y rolos</h2>${(()=>{const rs=datosResumen(R);if(!rs.filas.length)return '<p>Sin matrices</p>';
    return `<p>Matriz promedio: ${rs.mN?fmtN(rs.mDias)+' días · '+fmtN(rs.mTon)+' t':'—'} &nbsp;|&nbsp; Par de rolos promedio: ${rs.rN?fmtN(rs.rDias)+' días · '+fmtN(rs.rTon)+' t':'—'}</p>
    <table><tr><th>Pel.</th><th>Proveedor</th><th>Desde</th><th>Hasta</th><th>Días</th><th>t</th><th>Motivo</th><th>Rolos (proveedor · días · t)</th></tr>
    ${rs.filas.map(({m,r,segs})=>`<tr><td>P${m.peletera}</td><td>${esc(prov(m.proveedor).nombre)}</td><td>${fmtF(m.fecha)}</td><td>${r.enUso?'en uso':fmtF(r.retiro)}</td><td>${r.dias}</td><td>${fmtN(r.ton)}</td><td>${r.enUso?'':esc(r.motivoRetiro||'')}</td><td>${segs.map(s=>esc(prov(s.c.proveedor).corto)+' · '+s.dias+' d · '+fmtN(s.ton)+' t'+(s.rot?' (rotura)':'')).join('<br>')}</td></tr>`).join('')}</table>`;})()}
  <h2>Matrices por proveedor</h2>${tp(d.pp.matriz)}<h2>Rolos por proveedor</h2>${tp(d.pp.rolos)}
  <h2>Detalle de cambios</h2><table><tr><th>Fecha</th><th>Pel.</th><th>Tipo</th><th>Proveedor</th><th>Responsable</th><th>Operarios</th><th>Motivo</th><th>Días</th><th>t</th><th>Obs.</th></tr>
  ${d.l.map(c=>{const r=R[c.id];return `<tr><td>${fmtF(c.fecha)}</td><td>P${c.peletera}</td><td>${nomT(c.tipo)}</td><td>${esc(prov(c.proveedor).nombre)}</td><td>${esc(c.responsable)}</td><td>${(c.operarios||[]).map(esc).join(', ')}</td><td>${esc(c.motivo||'')}</td><td>${r.dias}${r.enUso?' (en uso)':''}</td><td>${fmtN(r.ton)}</td><td>${esc(c.obs||'')}</td></tr>`}).join('')}</table>`;
  window.print();
}
async function copiar(){
  const t=textoReporte();
  try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  toast('Reporte copiado');
}
function enviarWA(){window.open('https://wa.me/?text='+encodeURIComponent(textoReporte()),'_blank');}
function enviarMail(){location.href='mailto:?subject='+encodeURIComponent('Reporte matrices peletizadoras - '+periodoTxt())+'&body='+encodeURIComponent(textoReporte().replace(/\*/g,''));}

/* ---------- Ajustes (Dirección) ---------- */
function htmlAjustes(){
  const si=cfg.stockInicial||{};
  const base=location.origin+location.pathname;
  const links=[['produccion','Producción / Mantenimiento'],['admin','Administración'],['direccion','Dirección (solo vos)']];
  const meses=mesesProduccion();
  return `<div class="card"><h3>Producción mensual</h3>
    <div class="wrap"><table class="tbl"><tr><th>Mes</th><th>Producción (kg)</th><th>Días no trab.<br><span style="font-weight:400">(dom./feriados)</span></th><th class="n">Días trab.</th><th class="n">t/día por peletera</th></tr>
    ${meses.map(k=>{const dm=datosMes(k),p=(cfg.produccion||{})[k]||{},[y,m]=k.split('-').map(Number);
      return `<tr><td>${MESES[m-1].slice(0,3)} ${y}</td>
      <td><input class="kg" id="pk_${k}" inputmode="numeric" value="${p.kg?Number(p.kg).toLocaleString('es-AR'):''}" placeholder="kg" oninput="calcFila('${k}')"></td>
      <td><input class="nt" id="pn_${k}" type="number" min="0" max="31" value="${dm.noTrab}" oninput="calcFila('${k}')"></td>
      <td class="n" id="pt_${k}">${dm.trab}</td><td class="n" id="pr_${k}">${dm.kg?fmtN(dm.tpdPel):'—'}</td></tr>`;}).join('')}
    </table></div>
    <button class="pri" style="margin-top:10px" onclick="guardarProduccion()">Guardar producción</button>
    <p class="hint">Días no trabajados viene con los domingos del mes; ajustalo si se trabajó un domingo o hubo un feriado. t/día por peletera = producción ÷ días trabajados ÷ 3. Al guardar se recalculan las toneladas de todas las matrices y rolos.</p></div>
  <div class="card"><h3>Valor provisorio</h3>
    <div class="g2"><div><label class="f">Matrices (t/día)</label><input id="aj_tm" type="number" min="1" value="${cfg.tpdMatriz}"></div>
    <div><label class="f">Par de rolos (t/día)</label><input id="aj_tr" type="number" min="1" value="${cfg.tpdRolos}"></div></div>
    <button class="pri" style="margin-top:10px" onclick="guardarTpd()">Guardar</button>
    <p class="hint">Se usa solo para los meses que todavía no tienen la producción cargada (por ejemplo, el mes en curso).</p></div>
  <div class="card"><h3>Stock inicial</h3>
    <label class="f">Fecha de inicio</label><input id="aj_f0" type="date" value="${si.fecha||''}">
    <div class="wrap" style="margin-top:8px"><table class="tbl"><tr><th>Proveedor</th><th>Matrices</th><th>Camisas</th></tr>
    ${cfg.proveedores.map(p=>`<tr><td>${chip(p.id)}</td><td><input type="number" min="0" id="aj_m_${p.id}" value="${Number(si.matrices?.[p.id]||0)}"></td><td><input type="number" min="0" id="aj_c_${p.id}" value="${Number(si.camisas?.[p.id]||0)}"></td></tr>`).join('')}</table></div>
    <button class="pri" style="margin-top:10px" onclick="guardarStockIni()">Guardar stock inicial</button>
    <p class="hint">Cambios y facturas con fecha anterior a esta no mueven el stock (ya están contemplados acá). Sirven para dejar registrado qué había colocado.</p></div>
  <div class="card"><h3>Proveedores</h3>
    ${cfg.proveedores.map(p=>`<div class="row" style="justify-content:space-between;padding:4px 0">${chip(p.id)} <span class="mut" style="flex:1">${esc(p.nombre)}</span><button class="ico" title="Cambiar nombre" onclick="renombrarProv('${p.id}')"><i class="ti ti-edit"></i></button></div>`).join('')}
    <button class="dash" onclick="agregarProv()"><i class="ti ti-plus"></i> Agregar proveedor</button></div>
  <div class="card"><h3>Links para compartir</h3>
    ${links.map(([k,n])=>`<div style="margin:8px 0"><div class="mut">${n}</div><div class="row"><input readonly value="${base}?p=${k}" style="flex:1;font-size:13px"><button onclick="copiarTxt('${base}?p=${k}')"><i class="ti ti-copy"></i></button></div></div>`).join('')}
    <p class="hint">Cada link abre directamente su pantalla. El de Dirección no lo compartas: permite corregir y borrar todo.</p></div>`;
}
function mesesProduccion(){
  const ini=((cfg.stockInicial&&cfg.stockInicial.fecha)||'2026-02-01').slice(0,7);
  let desde=ini; cambios.forEach(c=>{if(c.fecha.slice(0,7)<desde)desde=c.fecha.slice(0,7);});
  if(desde>'2026-02') desde='2026-02';
  const hoy=hoyISO().slice(0,7), out=[]; let [y,m]=desde.split('-').map(Number);
  while(true){const k=y+'-'+String(m).padStart(2,'0');out.push(k);if(k>=hoy)break;m++;if(m>12){m=1;y++;}}
  return out.reverse();
}
const parseKg = v => { const s=String(v||'').replace(/[\s.]/g,'').replace(',','.'); const n=Number(s); return isFinite(n)&&n>0?Math.round(n):0; };
function calcFila(k){
  const [y,m]=k.split('-').map(Number), dm=diasDelMes(y,m);
  const kg=parseKg($('#pk_'+k).value), nt=Math.max(0,Number($('#pn_'+k).value)||0), tr=Math.max(0,dm-nt);
  $('#pt_'+k).textContent=tr; $('#pr_'+k).textContent=kg&&tr?fmtN(kg/1000/tr/3):'—';
}
function guardarProduccion(){
  const prod={};
  mesesProduccion().forEach(k=>{
    const [y,m]=k.split('-').map(Number), kg=parseKg($('#pk_'+k).value);
    const nt=Math.max(0,Math.min(diasDelMes(y,m),Number($('#pn_'+k).value)||0));
    if(kg||nt!==domingosDelMes(y,m)) prod[k]={kg,noTrab:nt};
  });
  Object.keys(cfg.produccion||{}).forEach(k=>{if(!(k in prod)&&!mesesProduccion().includes(k))prod[k]=cfg.produccion[k];});
  cfg.produccion=prod; guardarCfg('Producción guardada');
}
async function copiarTxt(t){try{await navigator.clipboard.writeText(t);toast('Link copiado');}catch(e){prompt('Copiá el link:',t);}}
async function guardarCfg(msg){try{await DOC_CFG.set(JSON.parse(JSON.stringify(cfg)));toast(msg||'Guardado');}catch(e){alert(errMsg(e));}}
function guardarTpd(){
  const m=Number($('#aj_tm').value), r=Number($('#aj_tr').value);
  if(!(m>0)||!(r>0)) return alert('Ingresá números mayores a cero.');
  cfg.tpdMatriz=m; cfg.tpdRolos=r; guardarCfg('Toneladas actualizadas');
}
function guardarStockIni(){
  const f=$('#aj_f0').value; if(!f) return alert('Poné la fecha de inicio.');
  const si={fecha:f,matrices:{},camisas:{}};
  cfg.proveedores.forEach(p=>{si.matrices[p.id]=Math.max(0,Number($('#aj_m_'+p.id).value)||0);si.camisas[p.id]=Math.max(0,Number($('#aj_c_'+p.id).value)||0);});
  cfg.stockInicial=si; guardarCfg('Stock inicial guardado');
}
function agregarProv(){
  const n=(prompt('Nombre del nuevo proveedor:')||'').trim(); if(!n) return;
  if(cfg.proveedores.some(p=>sinAc(p.nombre)===sinAc(n))) return alert('Ese proveedor ya existe.');
  const usados=cfg.proveedores.map(p=>p.color);
  let c=[0,1,2,3,4,5,6,7].find(i=>!usados.includes(i)); if(c===undefined) c=cfg.proveedores.length%8;
  const id=sinAc(n).replace(/[^a-z0-9]+/g,'').slice(0,12)+'_'+Date.now().toString(36);
  cfg.proveedores.push({id,nombre:n,corto:n.length>14?n.slice(0,13)+'.':n,color:c});
  guardarCfg('Proveedor agregado');
}
function renombrarProv(id){
  const p=cfg.proveedores.find(x=>x.id===id); if(!p) return;
  const n=(prompt('Nombre completo:',p.nombre)||'').trim(); if(!n) return;
  const c=(prompt('Nombre corto (para los recuadros):',p.corto)||'').trim()||n;
  p.nombre=n; p.corto=c; guardarCfg('Proveedor actualizado');
}

/* ---------- Formularios ---------- */
let F=null;
function abrirModal(h){$('#modalBox').innerHTML=h;$('#modal').classList.remove('hidden');window.scrollTo(0,0);}
function cerrarModal(){$('#modal').classList.add('hidden');$('#modalBox').innerHTML='';F=null;}
function optsProv(name,sel){return cfg.proveedores.map(p=>{const c=col(p.id);return `<label class="opt"><input type="radio" name="${name}" value="${p.id}" ${sel===p.id?'checked':''}><span class="chip big" style="background:${c.bg};color:${c.tx}">${esc(p.corto)}</span></label>`;}).join('');}

function abrirCambio(tipo,id){
  if(id && !DIR) return;
  const c=id?cambios.find(x=>x.id===id):null;
  F={tipo,id,ops:c?[...(c.operarios||[])]:[]};
  const tit=(c?'Corregir ':'Nuevo ')+(tipo==='matriz'?'cambio de matriz':'cambio de camisas de rolo');
  abrirModal(`<h2>${icoT(tipo)} ${tit}</h2>${tipo==='rolos'?'<div class="mut">1 par = 2 camisas (se descuentan del stock)</div>':''}
  <form id="fC" onsubmit="return false">
    <label class="f">Fecha de colocación</label><input type="date" id="f_fecha" value="${c?c.fecha:hoyISO()}">
    <label class="f">Peletera</label><div class="opts">${[1,2,3].map(p=>`<label class="opt seg"><input type="radio" name="pel" value="${p}" ${c&&c.peletera===p?'checked':''}><span>Peletera ${p}</span></label>`).join('')}</div>
    <label class="f">Proveedor ${tipo==='matriz'?'de la matriz':'de las camisas'}</label><div class="opts">${optsProv('prov',c&&c.proveedor)}</div>
    ${tipo==='matriz'&&!c?`<label class="row" style="margin-top:12px;font-size:14px;cursor:pointer"><input type="checkbox" id="f_conR" style="width:auto" onchange="$('#f_rprov').style.display=this.checked?'block':'none'"> También se colocó un par de camisas de rolo nuevo</label>
    <div id="f_rprov" style="display:none"><label class="f">Proveedor de las camisas</label><div class="opts">${optsProv('rprov')}</div></div>`:''}
    <label class="f">Responsable del cambio (apellido)</label><input id="f_resp" list="dl_pers" autocomplete="off" value="${c?esc(c.responsable):''}">
    <label class="f">Operarios intervinientes</label>
    <div class="row"><input id="f_op" list="dl_pers" autocomplete="off" placeholder="Apellido" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addOp();}"><button type="button" onclick="addOp()"><i class="ti ti-plus"></i> Agregar</button></div>
    <div id="f_ops" style="margin-top:4px"></div>
    <label class="f">Motivo del cambio (por qué se sacó la anterior)</label>
    <div class="opts">${MOTIVOS.map(m=>`<label class="opt seg${m==='Rotura'?' rot':''}"><input type="radio" name="mot" value="${m}" ${c&&c.motivo===m?'checked':''}><span>${m}</span></label>`).join('')}</div>
    <label class="f">Observaciones</label><textarea id="f_obs">${c?esc(c.obs||''):''}</textarea>
    <datalist id="dl_pers">${personas().map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
    <div class="err" id="f_err"></div>
    <div class="mbtns"><button type="button" onclick="cerrarModal()">Cancelar</button><button type="button" class="pri" id="f_btn" onclick="guardarCambio()">Guardar</button></div>
  </form>`);
  renderOps();
}
function renderOps(){$('#f_ops').innerHTML=F.ops.map((o,i)=>`<span class="pchip">${esc(o)}<button type="button" onclick="F.ops.splice(${i},1);renderOps()">×</button></span>`).join('');}
function addOp(){const v=canon($('#f_op').value);if(!v)return;if(!F.ops.some(o=>sinAc(o)===sinAc(v)))F.ops.push(v);$('#f_op').value='';renderOps();$('#f_op').focus();}
async function guardarCambio(){
  const fd=new FormData($('#fC')), err=$('#f_err');
  if($('#f_op').value.trim()) addOp();
  const fecha=$('#f_fecha').value, pel=Number(fd.get('pel')), pv=fd.get('prov'), resp=canon($('#f_resp').value);
  const faltan=[];
  if(!fecha)faltan.push('fecha');if(!pel)faltan.push('peletera');if(!pv)faltan.push('proveedor');if(!resp)faltan.push('responsable');
  const conR=$('#f_conR')&&$('#f_conR').checked, rpv=fd.get('rprov');
  if(conR&&!rpv)faltan.push('proveedor de las camisas');
  if(faltan.length){err.textContent='Falta completar: '+faltan.join(', ')+'.';return;}
  if(fecha>hoyISO()){err.textContent='La fecha no puede ser futura.';return;}
  const data={tipo:F.tipo,fecha,peletera:pel,proveedor:pv,responsable:resp,operarios:F.ops,motivo:fd.get('mot')||'',obs:$('#f_obs').value.trim()};
  if(F.tipo==='rolos') data.cantidad=2;
  if(!F.id && cambios.some(c=>c.tipo===F.tipo&&c.peletera===pel&&c.fecha===fecha) && !confirm('Ya hay un cambio de '+nomT(F.tipo).toLowerCase()+' en la Peletera '+pel+' con esa fecha. ¿Guardar igual?')) return;
  $('#f_btn').disabled=true; err.textContent='';
  try{
    if(F.id){
      const orig=cambios.find(x=>x.id===F.id);
      await db.collection(COL_C).doc(F.id).update({...data,editado:Date.now()});
      if(orig && orig.fecha!==fecha){
        const otro=F.tipo==='matriz'?'rolos':'matriz';
        const par=cambios.filter(x=>x.id!==orig.id&&x.tipo===otro&&x.peletera===orig.peletera&&x.fecha===orig.fecha);
        if(par.length && confirm(`En la Peletera ${orig.peletera} también hay ${otro==='rolos'?'un cambio de rolos':'un cambio de matriz'} con la fecha anterior (${fmtF(orig.fecha)}).\n¿Cambiar también su fecha a ${fmtF(fecha)}?`)){
          for(const x of par) await db.collection(COL_C).doc(x.id).update({fecha,editado:Date.now()});
        }
      }
    }
    else{
      const t=Date.now();
      await db.collection(COL_C).add({...data,creado:t,cargadoDesde:ROL});
      if(conR) await db.collection(COL_C).add({tipo:'rolos',fecha,peletera:pel,proveedor:rpv,responsable:resp,operarios:F.ops,motivo:data.motivo,obs:data.obs,cantidad:2,creado:t+1,cargadoDesde:ROL});
    }
    cerrarModal(); toast('Guardado');
  }catch(e){err.textContent=errMsg(e);$('#f_btn').disabled=false;}
}

function abrirFactura(id){
  if(!DIR) return;
  const f=id?facturas.find(x=>x.id===id):null;
  F={id};
  abrirModal(`<h2><i class="ti ti-file-invoice"></i> ${f?'Corregir factura':'Cargar factura'}</h2>
  <form id="fF" onsubmit="return false">
    <div class="g2"><div><label class="f">Fecha</label><input type="date" id="ff_fecha" value="${f?f.fecha:hoyISO()}"></div>
    <div><label class="f">N° de factura</label><input id="ff_num" value="${f?esc(f.numero||''):''}" placeholder="0003-00001245"></div></div>
    <label class="f">Proveedor</label><div class="opts">${optsProv('prov',f&&f.proveedor)}</div>
    <div class="g2"><div><label class="f">Matrices</label><input type="number" min="0" id="ff_m" value="${f?Number(f.matrices)||0:0}"></div>
    <div><label class="f">Camisas de rolo</label><input type="number" min="0" id="ff_c" value="${f?Number(f.camisas)||0:0}"></div></div>
    <label class="f">Observaciones</label><textarea id="ff_obs">${f?esc(f.obs||''):''}</textarea>
    <div class="err" id="ff_err"></div>
    <div class="mbtns"><button type="button" onclick="cerrarModal()">Cancelar</button><button type="button" class="pri" id="ff_btn" onclick="guardarFactura()">Guardar</button></div>
  </form>`);
}
async function guardarFactura(){
  const fd=new FormData($('#fF')), err=$('#ff_err');
  const fecha=$('#ff_fecha').value, pv=fd.get('prov'), m=Math.max(0,Number($('#ff_m').value)||0), c=Math.max(0,Number($('#ff_c').value)||0);
  if(!fecha||!pv){err.textContent='Falta completar: '+[!fecha&&'fecha',!pv&&'proveedor'].filter(Boolean).join(', ')+'.';return;}
  if(!m&&!c){err.textContent='Cargá al menos una matriz o una camisa.';return;}
  const data={fecha,numero:$('#ff_num').value.trim(),proveedor:pv,matrices:m,camisas:c,obs:$('#ff_obs').value.trim()};
  $('#ff_btn').disabled=true;
  try{
    if(F.id) await db.collection(COL_F).doc(F.id).update({...data,editado:Date.now()});
    else await db.collection(COL_F).add({...data,creado:Date.now()});
    cerrarModal(); toast('Factura guardada');
  }catch(e){err.textContent=errMsg(e);$('#ff_btn').disabled=false;}
}
async function borrar(colName,id){
  if(!DIR) return;
  if(!confirm('¿Borrar este registro? No se puede deshacer.')) return;
  try{await db.collection(colName).doc(id).delete();toast('Borrado');}catch(e){alert(errMsg(e));}
}

/* ---------- Tiempo real ---------- */
function falla(e){$('#app').innerHTML=`<div class="banner"><b>No se pudo conectar con la base de datos.</b><br>${esc(errMsg(e))}</div>`;}
DOC_CFG.onSnapshot(s=>{
  if(s.exists){const d=s.data();cfg={...JSON.parse(JSON.stringify(CFG_DEF)),...d};if(!Array.isArray(cfg.proveedores)||!cfg.proveedores.length)cfg.proveedores=CFG_DEF.proveedores;}
  loaded.g=true;render();
},falla);
db.collection(COL_C).onSnapshot(s=>{cambios=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.fecha&&c.tipo);loaded.c=true;render();},falla);
db.collection(COL_F).onSnapshot(s=>{facturas=s.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f.fecha);loaded.f=true;render();},falla);
setInterval(()=>{if(loaded.c)render();},60*60*1000);
</script>
